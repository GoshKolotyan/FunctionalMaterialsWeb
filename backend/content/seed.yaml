pages:
  - slug: home
    title: Discovering Stable Lead-Free Perovskites with AI
    lead: >-
      We design new perovskite materials for solar cells and LEDs by combining machine learning,
      density functional theory and laboratory synthesis in a single closed loop.
  - slug: about
    title: About the group
    lead: >-
      Founded at the end of 2022 at the Institute of Chemical Physics, NAS RA, within a project
      financed by the Higher Education and Science Committee of the Republic of Armenia.
    body: |
      ## Our goal

      The main goal of the group is to find **stable lead-free perovskites** (ABC₃ structures) for
      photovoltaic (solar cell) and light-emitting (LED) devices. The foreign leader of the project
      is **Dr. Hayk Khachatryan** (Huawei Finland Research Center).

      ## Approach

      We work in a closed loop:

      1. **Machine learning** models trained on existing data predict new stable perovskite compositions.
      2. **DFT calculations** check their stability and properties — band gap, crystal parameters.
      3. The most promising candidates are **synthesized and characterized** in the lab.
      4. The new experimental data are used to **retrain** the ML models.

      The same approach can be applied to other functional materials — for sensing, batteries and
      supercapacitors.

      ## Projects and grants

      - **Development of an artificial intelligence-based model for simulation, synthesis, and
        stabilization of the next generation solar cell and display materials: The perovskites**
        (22RL-012) — Higher Education and Science Committee, RA MoESCS. 2022–2027.
      - **Development of an artificial intelligence-based model for simulation, and syntheses of the
        next generation solar cell: The perovskites** — Enterprise Incubator Foundation (EIF). 2023–2025.
      - **AI Model Development for Optimization of the LM Composition** — proof-of-concept project
        financed by Huawei Technologies Oy (Finland). April–August 2025.
      - **Synthesis of new perovskite nanocrystals and their stabilisation through metal-organic
        framework systems** (24-YSIP-009, S. Grigoryan) — Tampere University, Finland, and National
        Institute of Chemistry, Ljubljana, Slovenia. 2025.
      - **Modification and characterization of capacitive field-effect sensors with
        enzyme-functionalized TMV nanodisks** (24-YSIP-016, A. Asatryan) — Institute of Nano- and
        Biotechnologies, Jülich, Germany. 2025.
      - Support for modernizing the material and technical base of scientific departments —
        Higher Education and Science Committee, RA MoESCS.

      ## Equipment

      Glovebox, solar simulator, EZ4-S spin coater, SC-UV-I UV/ozone cleaner, Tenkan XQM-2A ball
      mill, PP-12S press, rotary evaporator, MNPN-3 nitrogen generator (99.999%), xTool F1 Ultra
      laser engraver.
  - slug: contacts
    title: Contacts
    lead: We are open to collaborations, visiting researchers and students.

research:
  - title: Machine-learning materials discovery
    summary: >-
      Data-driven models trained on known compounds predict new stable lead-free perovskite
      compositions and guide what to make next.
    order: 0
  - title: DFT calculations
    summary: >-
      First-principles calculations verify the stability of predicted materials and their key
      properties — band gap and crystal parameters.
    order: 1
  - title: Synthesis and characterization
    summary: >-
      Promising candidates are synthesized and characterized in the lab; the results are fed back
      to retrain the models.
    order: 2
  - title: Devices and applications
    summary: >-
      Perovskites for solar cells and LEDs, and the same AI-driven approach for batteries,
      supercapacitors and sensors.
    order: 3

